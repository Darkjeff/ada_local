<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADA</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1524;
      color: #c9d1e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      padding: 12px 16px;
      background: #1a2236;
      border-bottom: 1px solid #232d45;
      font-size: 18px;
      font-weight: bold;
      color: #33b5e5;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #1e3a5f;
      color: #e0eaff;
    }
    .msg.ada {
      align-self: flex-start;
      background: #1a2236;
      border: 1px solid #232d45;
      color: #c9d1e0;
    }
    .msg.ada.thinking { opacity: 0.6; font-style: italic; }
    #form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #1a2236;
      border-top: 1px solid #232d45;
    }
    #input {
      flex: 1;
      background: #0f1524;
      border: 1px solid #232d45;
      border-radius: 8px;
      padding: 10px 14px;
      color: #c9d1e0;
      font-size: 15px;
      outline: none;
    }
    #input:focus { border-color: #33b5e5; }
    #send {
      background: #33b5e5;
      color: #0f1524;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>⚡ ADA</header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Message…" autocomplete="off" />
    <button id="send" type="submit">Envoyer</button>
  </form>

  <script>
    const messages = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const history = [];

    function addMsg(role, text, cls = '') {
      const div = document.createElement('div');
      div.className = `msg ${role} ${cls}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      send.disabled = true;

      addMsg('user', text);
      history.push({ role: 'user', content: text });

      const adaDiv = addMsg('ada', '…', 'thinking');
      let full = '';

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: history.slice(-10) }),
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        adaDiv.classList.remove('thinking');
        adaDiv.textContent = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          for (const line of chunk.split('\n')) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6).trim();
              if (data === '[DONE]') break;
              try {
                const { text: t } = JSON.parse(data);
                full += t;
                adaDiv.textContent = full;
                messages.scrollTop = messages.scrollHeight;
              } catch {}
            }
          }
        }
        history.push({ role: 'assistant', content: full });
      } catch (err) {
        adaDiv.textContent = '❌ Erreur : ' + err.message;
      }
      send.disabled = false;
      input.focus();
    });
  </script>
</body>
</html>
