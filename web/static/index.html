<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7b68ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ADA" />
  <title>ADA</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icon.svg" />
  <link rel="stylesheet" href="/static/core/base.css" />
</head>
<body>
  <div id="app">

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <nav id="sidebar" class="sidebar" aria-label="Navigation ADA">
      <div class="sidebar-header">
        <div class="logo-large">A</div>
        <span class="sidebar-title">ADA</span>
        <button id="sidebar-close" class="icon-btn ghost" aria-label="Fermer le menu">
          <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg>
        </button>
      </div>
      <ul class="nav-list">
        <li class="nav-item" data-view="dashboard">
          <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm0 10h8v8H3zM13 3h8v8h-8zm0 10h8v8h-8z" fill-rule="evenodd"/></svg>
          <span>Tableau de bord</span>
        </li>
        <li class="nav-item" data-view="chat">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
          <span>Discussion</span>
        </li>
        <li class="nav-item" data-view="page" data-page="planner" data-hint="Quelles sont mes tâches et mon planning du jour ?">
          <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
          <span>Planificateur</span>
        </li>
        <li class="nav-item" data-view="page" data-page="briefing" data-hint="Fais-moi un briefing de la journée : météo, actualités, agenda.">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 7h10v2H7zm0 4h10v2H7zm0 4h7v2H7z"/></svg>
          <span>Briefing</span>
        </li>
        <li class="nav-item" data-view="page" data-page="home" data-hint="Montre-moi l'état de mes lumières et appareils connectés.">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Domotique</span>
        </li>
        <li class="nav-item" data-view="cameras">
          <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          <span>Caméras</span>
        </li>
        <li class="nav-item" data-view="page" data-page="cad" data-hint="Génère un modèle 3D en STL pour moi.">
          <svg viewBox="0 0 24 24"><path d="M7.75 2.75h-1.5c-.69 0-1.25.56-1.25 1.25v1.5C5 6.19 5.56 6.75 6.25 6.75h1.5c.69 0 1.25-.56 1.25-1.25v-1.5c0-.69-.56-1.25-1.25-1.25zm8.5 0h-1.5c-.69 0-1.25.56-1.25 1.25v1.5c0 .69.56 1.25 1.25 1.25h1.5c.69 0 1.25-.56 1.25-1.25v-1.5c0-.69-.56-1.25-1.25-1.25zM12 9l-7 4 7 4 7-4-7-4zm-7 6l7 4 7-4"/></svg>
          <span>Agent CAD</span>
        </li>
        <li class="nav-item" data-view="webagent" data-hint="Fais une recherche sur le web pour moi.">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          <span>Agent Web</span>
        </li>
        <li class="nav-item" data-view="page" data-page="printers" data-hint="Quel est le statut de mes imprimantes 3D ?">
          <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
          <span>Imprimantes</span>
        </li>
        <li class="nav-item" data-view="page" data-page="skills" data-hint="Quelles sont mes compétences et skills disponibles ?">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
          <span>Compétences</span>
        </li>
        <li class="nav-item" data-view="memory">
          <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
          <span>Mémoire</span>
        </li>
        <li class="nav-item" data-view="page" data-page="senses" data-hint="Donne-moi les données des capteurs disponibles.">
          <svg viewBox="0 0 24 24"><path d="M12 1C5.93 1 1 5.93 1 12s4.93 11 11 11 11-4.93 11-11S18.07 1 12 1zm0 20c-4.96 0-9-4.04-9-9s4.04-9 9-9 9 4.04 9 9-4.04 9-9 9zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
          <span>Capteurs</span>
        </li>
        <li class="nav-item" data-view="page" data-page="music" data-hint="Joue de la musique.">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <span>Musique</span>
        </li>
        <li class="nav-item" data-view="page" data-page="library" data-hint="Cherche un livre dans ma bibliothèque Calibre.">
          <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
          <span>Bibliothèque</span>
        </li>
        <li class="nav-item" data-view="page" data-page="infrastructure" data-hint="Montre-moi l'état de l'infrastructure.">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          <span>Infrastructure</span>
        </li>
        <li class="nav-item" data-view="marketing">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          <span>Marketing</span>
        </li>
      </ul>
    </nav>

    <!-- Header -->
    <header>
      <button id="menu-btn" class="icon-btn ghost" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <div class="logo" title="ADA">A</div>
      <h1 id="view-title" class="view-title-mobile">…</h1>
      <div id="hw-bar" class="hw-bar-inline">
        <span class="hw-block"><span class="hw-label">CPU</span><span id="hw-cpu">—</span></span>
        <span class="hw-sep"></span>
        <span class="hw-block"><span class="hw-label">RAM</span><span id="hw-ram">—</span></span>
        <span class="hw-sep"></span>
        <span class="hw-block"><span class="hw-label">GPU</span><span id="hw-gpu">—</span></span>
        <span class="hw-sep"></span>
        <span class="hw-block"><span class="hw-label">VRAM</span><span id="hw-vram">—</span></span>
        <span class="hw-sep"></span>
        <span class="hw-block hw-models"><span class="hw-label">Modèles</span><span id="hw-models">—</span></span>
      </div>
      <div id="status-dot" title="Statut — cliquer pour le menu admin" role="button" tabindex="0"></div>
      <div id="admin-menu" class="admin-menu hidden">
        <div class="admin-menu-title">Administration</div>
        <button id="admin-restart" class="admin-menu-item">↺ Redémarrer le serveur</button>
        <button id="admin-clear-cache" class="admin-menu-item">🗑 Vider le cache SW</button>
      </div>
    </header>

    <div id="viewport"></div>

    <!-- Barre de saisie — activée par la vue Chat uniquement -->
    <div id="input-bar" class="hidden">
      <button id="mic-btn" class="icon-btn ghost-outline" aria-label="Saisie vocale" title="Parler">
        <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm6 9a1 1 0 0 1 2 0 8 8 0 0 1-7 7.93V20h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-2.07A8 8 0 0 1 4 10a1 1 0 0 1 2 0 6 6 0 0 0 12 0z"/></svg>
      </button>
      <button id="tts-btn" aria-label="Retour sonore" title="Activer/désactiver la voix">
        <svg id="tts-on"  viewBox="0 0 24 24" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.74 2.5-2.26 2.5-4.02zM14 3.23v2.06c3.39.49 6 3.39 6 6.71s-2.61 6.22-6 6.71v2.06c4.5-.52 8-4.31 8-8.77s-3.5-8.25-8-8.77z"/></svg>
        <svg id="tts-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
      <textarea id="text-input" rows="1" placeholder="Écrivez un message…"
        autocomplete="off" autocorrect="off" spellcheck="true" aria-label="Message"></textarea>
      <button id="send-btn" class="icon-btn" aria-label="Envoyer">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

  </div><!-- /#app -->

  <div id="toast" role="status" aria-live="assertive"></div>

  <script type="module" src="/static/core/core.js"></script>
</body>
</html>
